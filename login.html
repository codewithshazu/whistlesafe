<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WhistleSafe login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      overflow: hidden;
      background: #0f0f0f;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1000px;
      position: relative;
    }

    /* Animated background */
    .background {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }

    .circle {
      position: absolute;
      bottom: -150px;
      width: 20px;
      height: 20px;
      background: linear-gradient(#00f2fe, #4facfe);
      border-radius: 50%;
      opacity: 0.5;
      animation: rise 20s infinite ease-in;
    }

    @keyframes rise {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0.7;
      }
      100% {
        transform: translateY(-1200px) scale(1.5);
        opacity: 0;
      }
    }

    .container {
      transform-style: preserve-3d;
      z-index: 2;
    }

    .login-box {
      background: #1c1c1c;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 0 30px #00f2fe, 0 0 60px #4facfe;
      transform: rotateX(15deg) rotateY(15deg);
      transition: transform 0.5s;
      min-width: 300px;
    }

    .login-box:hover {
      transform: rotateX(0deg) rotateY(0deg) scale(1.05);
    }

    .login-box h2 {
      color: #fff;
      text-align: center;
      margin-bottom: 20px;
      font-weight: 600;
      letter-spacing: 2px;
    }

    .login-box h2 i {
      color: #ff0066;
      margin: 0 5px;
    }

    .inputBox {
      position: relative;
      margin-bottom: 20px;
    }

    .inputBox input {
      width: 100%;
      padding: 10px;
      background: #333;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 1rem;
    }

    .inputBox span {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #aaa;
      font-size: 0.9rem;
      pointer-events: none;
      transition: 0.3s;
    }

    .inputBox input:focus + span,
    .inputBox input:valid + span {
      top: 0;
      font-size: 0.7rem;
      color: #00f2fe;
    }

    .links {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
    }

    .links a {
      color: #aaa;
      font-size: 0.9rem;
      text-decoration: none;
      transition: 0.3s;
    }

    .links a:hover {
      color: #00f2fe;
    }

    input[type="submit"] {
      width: 100%;
      padding: 10px;
      background: linear-gradient(45deg, #00f2fe, #4facfe);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
    }

    input[type="submit"]:hover {
      background: linear-gradient(45deg, #4facfe, #00f2fe);
    }

    /* Forgot Password Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 10;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
    }

    .modal-content {
      background: #1c1c1c;
      margin: 10% auto;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 0 30px #00f2fe, 0 0 60px #4facfe;
      width: 80%;
      max-width: 400px;
      position: relative;
      animation: modalopen 0.5s;
    }

    @keyframes modalopen {
      from {
        opacity: 0;
        transform: translateY(-50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .close {
      color: #aaa;
      position: absolute;
      top: 10px;
      right: 20px;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }

    .close:hover {
      color: #00f2fe;
    }

    .modal h2 {
      color: #fff;
      text-align: center;
      margin-bottom: 20px;
    }

    .success-message {
      color: #4facfe;
      text-align: center;
      margin-top: 15px;
      display: none;
    }
  </style>

  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>

<body>

  <!-- Glowing animated circles background -->
  <div class="background" id="background"></div>

  <div class="container">
    <div class="login-box">
      <h2><i class="fas fa-heart"></i> LOGIN <i class="fas fa-heart"></i></h2>
      <form autocomplete="off">
        <div class="inputBox">
         <input type="text" required id="username">
          <span>Username</span>
        </div>
        <div class="inputBox">
          <input type="text" required id="erp">
          <span>ERP</span>
        </div>
        <div class="inputBox">
            <input type="password" required id="password">
            <span>Password</span>
        </div>
        <div class="links">
          <a href="#" id="forgotPasswordLink">Forgot Password?</a>
          <a href="#">Sign Up</a>
        </div>
        <input type="submit" value="Sign in">
      </form>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div id="forgotPasswordModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>Reset Password</h2>
      <div class="inputBox">
        <input type="text" required id="recoveryEmail">
        <span>Email or Username</span>
      </div>
      <input type="submit" value="Send Reset Link" id="sendResetLink">
      <div class="success-message" id="successMessage">
        Password reset link has been sent to your email!
      </div>
    </div>
  </div>

  <!-- JavaScript for background animation and functionality -->
  <script>
    const background = document.getElementById('background');

    for (let i = 0; i < 20; i++) {
      const circle = document.createElement('div');
      circle.classList.add('circle');
      circle.style.left = Math.random() * 100 + 'vw';
      circle.style.animationDuration = (5 + Math.random() * 15) + 's';
      circle.style.width = circle.style.height = (10 + Math.random() * 30) + 'px';
      background.appendChild(circle);
    }

    // Forgot Password Functionality
    const forgotPasswordLink = document.getElementById('forgotPasswordLink');
    const modal = document.getElementById('forgotPasswordModal');
    const closeBtn = document.querySelector('.close');
    const sendResetLink = document.getElementById('sendResetLink');
    const successMessage = document.getElementById('successMessage');

    forgotPasswordLink.addEventListener('click', function(e) {
      e.preventDefault();
      modal.style.display = 'block';
    });

    closeBtn.addEventListener('click', function() {
      modal.style.display = 'none';
      successMessage.style.display = 'none';
    });

    window.addEventListener('click', function(e) {
      if (e.target === modal) {
        modal.style.display = 'none';
        successMessage.style.display = 'none';
      }
    });

    sendResetLink.addEventListener('click', function(e) {
      e.preventDefault();
      const recoveryEmail = document.getElementById('recoveryEmail').value;
      
      if (recoveryEmail) {
        // In a real application, you would send this to your server
        // For this demo, we'll just show a success message
        successMessage.style.display = 'block';
        
        // Reset the form and close the modal after 3 seconds
        setTimeout(function() {
          document.getElementById('recoveryEmail').value = '';
          successMessage.style.display = 'none';
          modal.style.display = 'none';
        }, 3000);
      }
    });

    // Simple form validation for login
    document.querySelector('.login-box form').addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const erp = document.getElementById('erp').value;
      const password = document.getElementById('password').value;
      
      if (username && erp && password) {
        alert('Login submitted! (This is a demo)');
        // In a real application, you would send this to your server
      } else {
        alert('Please fill in all fields');
      }
    });
  </script>

</body>
</html>
